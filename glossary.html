ent or attribute stored on-chain."],["POAP","Proof of Attendance Protocol — a badge proving you attended an event."],["Re-verification","Periodically re-checking holdings so access ends when a token is sold."],["Redeemable","An NFT that can be exchanged for goods or experiences."],["Role","A permission level (e.g. in Discord) granted by the gate."],["Royalty","A share of secondary sales paid to the creator."],["Seed phrase","The master secret of a wallet. Never share it."],["Signature","A cryptographic proof you control a wallet — free and doesn't move assets."],["Snapshot","A gas-free voting platform; also a point-in-time record of holders."],["Soulbound token","A non-transferable token tied to one wallet."],["Sybil attack","One person pretending to be many to game rewards."],["Token","A digital asset on a blockchain, fungible or not."],["Token gating","Restricting access to holders of a specific token or credential."],["Wallet","Software or hardware that holds keys and signs messages/transactions."],["Webhook","A notification sent when an on-chain event (like a transfer) happens."]];
